<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Celestia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="guard" hidden></div>
<div id="stage">
  <div id="screen"><div id="boot" style="padding:24px;line-height:2">LOADING CELESTIA...</div></div>
  <div id="popup" hidden></div>
  <canvas id="fx" width="920" height="560"></canvas>
</div>
<script>
function bootFail(f){document.getElementById('boot')&&(document.getElementById('boot').innerHTML='ERROR: COULD NOT LOAD '+f+'<br>UPLOAD ALL FILES TO THE REPO ROOT: index.html, style.css, assets.js, data.js, game.js');}
window.addEventListener('error',function(e){if(e.target&&e.target.src)bootFail(e.target.src.split('/').pop());},true);
</script>
<script src="assets.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
