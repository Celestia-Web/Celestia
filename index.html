<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Celestia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; image-rendering: pixelated; }
html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
  font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.6; }
/* Stage is 11.5 : 7 -> 920 x 560, scaled by JS to fit the tab */
#stage { position: absolute; left: 50%; top: 50%; width: 920px; height: 560px;
  transform-origin: center; background: #000; overflow: hidden; }
#screen { position: absolute; inset: 0; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hud { position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex;
  justify-content: space-between; align-items: center; padding: 0 12px; background: #000;
  border-bottom: 2px solid #fff; z-index: 5; }
.actions { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; gap: 12px;
  justify-content: center; z-index: 5; }
.btn { background: #000; color: #fff; border: 2px solid #fff; font: inherit; font-size: 10px;
  padding: 10px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { background: #fff; color: #000; }
.btn:disabled { border-color: #555; color: #555; cursor: default; }
.box { background: #000; border: 2px solid #fff; padding: 14px; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 16px; text-align: center; }
h1 { font-size: 36px; margin: 0; letter-spacing: 6px; }
input { background: #000; color: #fff; border: 2px solid #fff; font: inherit; font-size: 12px;
  padding: 10px; width: 330px; text-align: center; outline: none; }
#popup { position: absolute; left: 90px; right: 90px; bottom: 70px; z-index: 20; background: #000;
  border: 2px solid #fff; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  align-items: flex-end; box-shadow: 0 0 0 4px #000; }
#popup .pt { width: 100%; line-height: 1.9; }
#popup[hidden], #guard[hidden] { display: none; }
#guard { position: fixed; inset: 0; z-index: 99; background: #000; color: #fff; display: flex;
  align-items: center; justify-content: center; text-align: center; padding: 24px; line-height: 2.2; }
.bar { width: 320px; height: 16px; border: 2px solid #fff; }
.bar > div { height: 100%; width: 0; background: #fff; }
.mid { position: absolute; left: 0; right: 0; top: 250px; display: flex; flex-direction: column;
  align-items: center; gap: 12px; z-index: 5; }
.panel { position: absolute; right: 12px; top: 46px; width: 250px; z-index: 6; display: flex;
  flex-direction: column; gap: 10px; }
.banner { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; z-index: 5; letter-spacing: 3px; }
canvas.map { position: absolute; inset: 0; cursor: grab; }
canvas.map:active { cursor: grabbing; }
.tbar { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; z-index: 5;
  background: #000; border-top: 2px solid #fff; border-bottom: 2px solid #fff; padding: 10px; }

/* ===== 1.1: Ubuntu UI, nicer look. Only animations/sprites stay pixelated ===== */
html, body, input, .btn { font-family: 'Ubuntu', system-ui, sans-serif; }
html, body { font-size: 15px; line-height: 1.5; }
.hud { height: 38px; font-weight: 500; background: linear-gradient(#000, #0a0a0a); letter-spacing: .5px; }
.btn { font-size: 14px; font-weight: 700; letter-spacing: 1px; padding: 10px 20px; border-radius: 8px;
  background: linear-gradient(#1c1c1c, #000); transition: transform .1s, background .15s, color .15s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(255,255,255,.35); }
.box { border-radius: 10px; background: rgba(0,0,0,.82); box-shadow: 0 6px 22px rgba(0,0,0,.7); }
input { font-size: 16px; border-radius: 8px; }
h1 { font-size: 58px; font-weight: 700; letter-spacing: 14px; margin: 0; text-shadow: 0 0 22px rgba(255,255,255,.5); }
#popup { font-size: 16px; border-radius: 12px; background: rgba(0,0,0,.92); box-shadow: 0 8px 40px rgba(0,0,0,.9), 0 0 0 1px #444; }
#guard { font-size: 20px; }
.bar { border-radius: 8px; overflow: hidden; height: 18px; } .sm { font-size: 12px; opacity: .8; }
.tl { position: absolute; left: 12px; top: 48px; z-index: 5; }
.sub { letter-spacing: 4px; opacity: .8; }
.row { display: flex; gap: 12px; }
.ships { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 880px; }
.sc { border: 2px solid #444; border-radius: 10px; padding: 6px 4px; cursor: pointer; background: #050505; font-size: 10px; font-weight: 700; transition: .12s; }
.sc:hover { border-color: #aaa; } .sc.on { border-color: #fff; background: #1a1a1a; box-shadow: 0 0 16px rgba(255,255,255,.4); transform: translateY(-3px); }
.sc canvas { width: 104px; height: 56px; display: block; margin: 0 auto 4px; }
.sd { min-height: 40px; width: 700px; opacity: .9; }
.moss { position: absolute; width: 72px; height: 54px; cursor: grab; z-index: 6; touch-action: none; user-select: none; }
.shop { position: absolute; left: 12px; top: 110px; width: 430px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.shop .ln { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.shop .btn { padding: 6px 12px; font-size: 12px; }
.toast { position: absolute; right: 14px; top: 50px; z-index: 40; background: #fff; color: #000; padding: 6px 12px; border-radius: 8px; font-weight: 700; animation: fl 2.4s forwards; }
@keyframes fl { to { transform: translateY(-22px); opacity: 0; } }
.hp { position: absolute; right: 12px; top: 48px; width: 270px; z-index: 5; }

/* ===== 1.2 ===== */
.sc canvas { width: 128px; height: 64px; }
.row { flex-wrap: wrap; justify-content: center; max-width: 880px; }
.shop2 { position: absolute; right: 12px; top: 110px; width: 400px; z-index: 5; display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
.sw { width: 26px; height: 26px; border: 2px solid #fff; border-radius: 6px; cursor: pointer; padding: 0; }
.sw.on { outline: 2px solid #fff; outline-offset: 2px; }
#mute { position: absolute; left: 10px; bottom: 10px; z-index: 25; padding: 6px 10px; font-size: 11px; }
.bg { animation: landz .9s ease-out; }
@keyframes landz { from { transform: scale(1.35); opacity: .2; } to { transform: scale(1); opacity: 1; } }
.shop, .shop2 { top: 148px; }
.shop2 { max-height: 390px; }

/* ===== 1.3 ===== */
.hud { height: 46px; padding: 0 12px; }
.hl { display: flex; flex-direction: column; line-height: 1.15; min-width: 190px; } .hs { font-size: 17px; letter-spacing: 1px; }
.hc { text-align: center; line-height: 1.2; flex: 1; } .hc b { font-size: 14px; letter-spacing: 1px; }
.hr { display: flex; gap: 14px; font-size: 13px; font-weight: 500; min-width: 330px; justify-content: flex-end; } #hz { font-weight: 700; }
.fz { position: absolute; right: 18px; top: 52px; z-index: 40; font-weight: 700; font-size: 20px; color: #fff; text-shadow: 0 0 10px #fff; animation: fl 1.5s forwards; }
.btn.pri { background: #fff; color: #000; } .btn.pri:hover:not(:disabled) { background: #dcdcdc; }
.btn.sec { background: transparent; } .btn.dng { border-color: #9a5a5a; color: #d9a0a0; background: #140808; } .btn.dng:hover:not(:disabled) { background: #5a1f1f; color: #fff; }
.btn:active:not(:disabled) { transform: scale(.95); } .btn:focus-visible, .card:focus-visible, .sw:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#popup { left: 150px; right: 150px; padding: 12px 16px; font-size: 14px; gap: 10px; } #popup:not([hidden]) { animation: pin .18s ease-out; } #popup.out { opacity: 0; transition: opacity .17s; }
@keyframes pin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#popup .row { justify-content: flex-end; gap: 8px; }
.tw { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.mega { font-size: 104px; letter-spacing: 26px; line-height: 1; text-shadow: 0 0 40px rgba(255,255,255,.55), 0 4px 0 #444; margin: 0 0 0 26px; }
.car { width: 880px; height: 300px; overflow: hidden; position: relative; cursor: grab; touch-action: pan-y; } .car:active { cursor: grabbing; }
.trk { display: flex; gap: 20px; position: absolute; left: 0; top: 0; will-change: transform; }
.card { width: 300px; height: 292px; border: 2px solid #3a3a3a; border-radius: 12px; background: rgba(8,8,8,.85); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; transition: transform .2s, border-color .2s, box-shadow .2s; }
.card.on { border-color: #fff; box-shadow: 0 0 28px rgba(255,255,255,.35); transform: scale(1.03); }
.card.on .cv canvas { animation: bob 2.4s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(-6px); } }
.cv canvas { width: 270px; height: 135px; display: block; pointer-events: none; } .tag { font-size: 10px; letter-spacing: 2px; opacity: .75; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; } .chip { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: #1a1a1a; }
.chip.g { color: #8ae89a; } .chip.b { color: #f09a9a; } .chip.n { color: #aaa; } .dsc { font-size: 10px; opacity: .7; text-align: center; line-height: 1.3; flex: 1; }
.slw { position: relative; width: 600px; height: 26px; touch-action: none; cursor: pointer; } .slt { position: absolute; top: 11px; left: 0; right: 0; height: 4px; background: #666; border-radius: 2px; }
.slh { position: absolute; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px #fff; } .tick { position: absolute; top: 6px; width: 2px; height: 14px; background: #999; }
.npc { position: absolute; z-index: 6; display: flex; gap: 12px; align-items: flex-start; } .npc img { width: 112px; height: 112px; border: 2px solid #fff; border-radius: 10px; background: #000; }
.npc .sp { background: rgba(0,0,0,.85); border: 2px solid #fff; border-radius: 10px; padding: 10px 14px; max-width: 640px; line-height: 1.5; font-size: 14px; }
.npc.big { left: 14px; top: 54px; } .npc.solo { left: 14px; top: 160px; } .npc.solo img { width: 100px; height: 100px; } .npc.shopnpc { left: 14px; bottom: 62px; align-items: flex-end; } .npc.shopnpc img { width: 84px; height: 84px; } .npc.shopnpc .sp { max-width: 320px; font-size: 12px; }
.jb { position: absolute; left: 14px; right: 14px; top: 184px; bottom: 74px; z-index: 5; overflow: auto; display: flex; flex-direction: column; gap: 5px; font-size: 13px; } .jb .btn { padding: 4px 10px; font-size: 11px; }
.shop2 { max-height: 250px; } #mbtn { position: absolute; left: 10px; bottom: 10px; z-index: 25; padding: 6px 12px; font-size: 11px; }
#menu { position: absolute; left: 80px; right: 80px; top: 50px; bottom: 40px; z-index: 30; background: rgba(0,0,0,.96); border: 2px solid #fff; border-radius: 12px; padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 10px; animation: pin .18s ease-out; }
#menu[hidden] { display: none; } .mh { display: flex; justify-content: space-between; align-items: center; font-size: 18px; } .mg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .mg > div { border: 1px solid #333; border-radius: 8px; padding: 8px; }
input[type=range] { width: 150px; padding: 0; } input[type=checkbox] { width: 20px; padding: 0; }
#wipe { position: absolute; inset: 0; background: #000; z-index: 28; pointer-events: none; opacity: 0; } #wipe.go { animation: wp .5s ease-out; } @keyframes wp { from { opacity: 1; } to { opacity: 0; } }
.amb { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; } #fx2 { position: absolute; inset: 0; pointer-events: none; z-index: 29; }
.tbar { text-align: center; } .tn { font-size: 22px; font-weight: 700; letter-spacing: 3px; } .tp { width: 600px; margin: 8px auto 0; } .tp > div { background: #fff; transition: width .2s; }
.bar.pulse > div { animation: pl 1s ease-in-out infinite; } @keyframes pl { 50% { box-shadow: 0 0 14px #fff; filter: brightness(.7); } }
.rm *, .rm { animation: none !important; transition: none !important; }
.jb .ln, #menu .ln { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* ===== 1.4 ===== */
#popup { z-index: 60; } .toast, .fz { z-index: 61; }
.shop { max-height: 284px; overflow: auto; }
.npc.shopnpc { bottom: 52px; } .npc.shopnpc img { width: 72px; height: 72px; } .npc.shopnpc .sp { max-width: 300px; }

</style>
</head>
<body>
<div id="guard" hidden></div>
<div id="stage">
  <div id="screen"><div id="boot" style="padding:24px;line-height:2">LOADING CELESTIA...</div></div>
  <div id="popup" hidden></div>
  <canvas id="fx" width="920" height="560"></canvas>
</div>
<script>
function bootFail(f){document.getElementById('boot')&&(document.getElementById('boot').innerHTML='ERROR: COULD NOT LOAD '+f+'<br>UPLOAD ALL FILES TO THE REPO ROOT: index.html, style.css, data.js, game.js, game2.js, game3.js, game4.js, game5.js, game6.js, game7.js');}
window.addEventListener('error',function(e){if(e.target&&e.target.src)bootFail(e.target.src.split('/').pop());},true);
</script>
<script>
// Celestia - data & story text
const FIRST_NAMES = ['Silent','Crimson','Lunar','Iron','Rogue','Drifting','Hollow','Bright','Wandering','Quiet','Rusty','Stellar','Pale','Wild'];
const LAST_NAMES  = ['Comet','Sparrow','Voyager','Lantern','Falcon','Meridian','Harbor','Tide','Ember','Wren','Horizon','Nomad','Pilgrim','Spark'];

const TUNING = {
  minerRate: 0.5,      // Retro Miner: 0.5 per second
  toughness: 0.3,      // Lunarrite toughness
  need: 50,            // lunarrite required
  reward: 5000,        // Zeals
  warpSeconds: 2,      // travel animation length
  travelSeconds: 5     // Port <-> Lear = 5 kilayears = 5 seconds
};
// mining speed = miner rate / toughness  (0.5 / 0.3 = 1.667 per second)
TUNING.mineRate = TUNING.minerRate / TUNING.toughness;

const PLACES = {
  farport: { name: 'FARPORT', sub: 'JOB HUB PLANET' },
  korr:    { name: 'KORR',    sub: 'LUNARRITE MINING PLANET' },
  bazaar:  { name: 'BAZAAR',  sub: 'SHOP PLANET' },
  home:    { name: 'HOME',    sub: 'YOUR PLANET' }
};

const SYSTEMS = [
  { id: 'port', name: 'PORT SYSTEM', x: -240, y: 0, sun: 16, planets: [
    { id: 'farport', name: 'FARPORT', r: 11, color: '#f7d878', angle: 0.7, speed: 0.25, orbit: 95 },
    { id: 'bazaar', name: 'BAZAAR', r: 8, color: '#5fb6c8', angle: 3.6, speed: 0.4, orbit: 58 } ] },
  { id: 'lear', name: 'LEAR SYSTEM', x: 240, y: 0, sun: 13, planets: [
    { id: 'korr', name: 'KORR', r: 5.5, color: '#9a9a9a', angle: 2.4, speed: 0.35, orbit: 66 },
    { id: 'home', name: 'HOME', r: 6.5, color: '#6bc57a', angle: 5.1, speed: 0.5, orbit: 40 } ] }
];

</script>
<script>
// Celestia - game logic
const $ = s => document.querySelector(s);
const T = TUNING;
const S = { ship: '', loc: 'farport', step: 0, ore: 0, zeals: 0, mining: false,
            view: 'name', mapUnlocked: false, travel: null };
/* Tutorial steps:
 0 name ship | 1 find the client at Farport | 2 travel to Korr | 3 mine 50 lunarrite
 4 return to Farport | 5 deliver at the hut | 6 leave into space | 7 tutorial complete */

let playable = false, last = performance.now();
const rnd = a => a[Math.floor(Math.random() * a.length)];
const randName = () => rnd(FIRST_NAMES) + ' ' + rnd(LAST_NAMES);

/* ---------- tab pause / scaling ---------- */
function checkPlay() {
  const w = innerWidth, h = innerHeight;
  playable = !document.hidden;
  const g = $('#guard');
  g.hidden = playable;
  if (!playable) g.innerHTML = 'PAUSED<br>RETURN TO THIS TAB';
  // stage keeps its 11.5:7 layout and scales to fit any tab size
  const s = Math.min(w / 920, h / 560);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', () => checkPlay());
document.addEventListener('visibilitychange', () => checkPlay());

/* ---------- popups ---------- */
function popup(text, label, cb) {
  const p = $('#popup'); p.hidden = false;
  p.innerHTML = `<div class="pt">${text}</div><button class="btn" id="pb">${label || 'OK'}</button>`;
  $('#pb').onclick = () => { p.hidden = true; cb && cb(); };
}
function popups(list, done) {
  const next = i => i >= list.length ? (done && done()) :
    popup(list[i], i === list.length - 1 ? 'OK' : 'NEXT', () => next(i + 1));
  next(0);
}

/* ---------- HUD ---------- */
function questText() {
  return ['', 'QUEST: FIND THE CLIENT', 'QUEST: GO TO KORR',
    `QUEST: MINE LUNARRITE ${Math.floor(S.ore)}/${T.need}`, 'QUEST: RETURN TO FARPORT',
    'QUEST: DELIVER TO THE HUT', 'QUEST: LEAVE INTO SPACE', 'TUTORIAL COMPLETE'][S.step] || '';
}
function hud() { return ''; }

/* ---------- screens ---------- */
function render() {
  S.mining = false;
  const el = $('#screen');
  if (S.view === 'name') return renderName(el);
  if (S.view === 'planet') return renderPlanet(el);
  if (S.view === 'hut') return renderHut(el);
  if (S.view === 'travel') return renderTravel(el);
  if (S.view === 'map') return renderMap(el);
}

function renderName(el) {
  el.innerHTML = `<div class="center"><h1>CELESTIA</h1>
    <img src="${IMG.ship}" style="width:184px;height:112px;border:2px solid #fff">
    <div>NAME YOUR SHIP</div>
    <input id="nm" maxlength="24" value="${randName()}">
    <div style="display:flex;gap:12px"><button class="btn" id="rn">RANDOMIZE</button><button class="btn" id="go">LAUNCH</button></div></div>`;
  $('#rn').onclick = () => $('#nm').value = randName();
  $('#go').onclick = () => {
    S.ship = ($('#nm').value.trim() || randName()).toUpperCase();
    S.step = 1; S.view = 'planet'; S.loc = 'farport'; render();
    popups([`WELCOME, CAPTAIN OF THE ${S.ship}. THIS IS FARPORT, A JOB HUB PLANET.`,
      'JOBS COME FROM PEOPLE. SOMEONE HERE HAS ASKED FOR A PILOT. GO TO THEIR HUT.']);
  };
}

function renderPlanet(el) {
  const L = S.loc, P = PLACES[L];
  let acts = '', mid = '';
  if (L === 'farport') {
    if (S.step === 1 || S.step === 5) acts += `<button class="btn" id="hut">${S.step === 5 ? 'GO TO THE HUT (DELIVER)' : 'VISIT THE HUT'}</button>`;
    if (S.step === 2) acts += `<button class="btn" id="tk">TRAVEL TO KORR</button>`;
    if (S.step === 6) acts += `<button class="btn" id="leave">LEAVE INTO SPACE</button>`;
    if (S.step >= 7) acts += `<button class="btn" id="hut">VISIT THE HUT</button><button class="btn" id="map">OPEN MAP</button>`;
  } else {
    if (S.step === 3) {
      mid = `<div class="mid box"><div>LUNARRITE  TOUGHNESS ${T.toughness}</div>
        <div id="ore">${S.ore.toFixed(1)} / ${T.need}</div>
        <div class="bar"><div id="bar"></div></div></div>`;
      acts += `<button class="btn" id="mine">START MINING</button>`;
    }
    if (S.step === 4) acts += `<button class="btn" id="tf">TRAVEL TO FARPORT</button>`;
    if (S.step >= 7) acts += `<button class="btn" id="map">OPEN MAP</button>`;
  }
  el.innerHTML = `<img class="bg" src="${IMG[L]}">
    ${hud()}${mid}
    <div class="box" style="position:absolute;left:12px;top:46px;z-index:5">${P.name}<br><span style="font-size:8px">${P.sub}</span></div>
    <div class="actions">${acts}</div>`;
  const on = (id, f) => { const b = $('#' + id); if (b) b.onclick = f; };
  on('hut', () => { S.view = 'hut'; render(); });
  on('tk', () => startTravel('korr'));
  on('tf', () => startTravel('farport'));
  on('map', () => { S.view = 'map'; render(); });
  on('leave', leaveIntoSpace);
  on('mine', () => { S.mining = !S.mining; $('#mine').textContent = S.mining ? 'STOP MINING' : 'START MINING'; });
  updateOre();
}

function updateOre() {
  const o = $('#ore'); if (!o) return;
  o.textContent = `${S.ore.toFixed(1)} / ${T.need}`;
  $('#bar').style.width = (S.ore / T.need * 100) + '%';
  $('#qt').textContent = questText();
}

function renderHut(el) {
  let text, btn = '';
  if (S.step === 1) {
    text = `OLD TOBIN: "${S.ship}! I NEED ${T.need} LUNARRITE FROM KORR. I'LL PAY ${T.reward.toLocaleString()} ZEALS. BRING IT TO ME HERE."`;
    btn = '<button class="btn" id="ok">ACCEPT JOB</button>';
  } else if (S.step === 5) {
    text = `OLD TOBIN: "THAT'S ${T.need} LUNARRITE! HERE ARE YOUR ${T.reward.toLocaleString()} ZEALS."`;
    btn = '<button class="btn" id="ok">DELIVER LUNARRITE</button>';
  } else text = 'OLD TOBIN: "SAFE FLIGHTS, CAPTAIN."';
  el.innerHTML = `<div class="center"><div class="box" style="width:640px;line-height:2">${text}</div>
    <div style="display:flex;gap:12px">${btn}<button class="btn" id="bk">LEAVE HUT</button></div></div>${hud()}`;
  $('#bk').onclick = () => { S.view = 'planet'; render(); };
  const ok = $('#ok');
  if (ok) ok.onclick = () => {
    if (S.step === 1) {
      S.step = 2; S.view = 'planet'; render();
      popups(['JOB ACCEPTED: MINE 50 LUNARRITE ON KORR AND BRING IT BACK.',
        'PRESS TRAVEL TO KORR. THE JOURNEY TAKES 5 SECONDS.']);
    } else {
      S.step = 6; S.ore = 0; S.zeals += T.reward; S.view = 'planet'; render();
      popups([`JOB COMPLETE! +${T.reward.toLocaleString()} ZEALS.`, 'YOU ARE READY. PRESS LEAVE INTO SPACE.']);
    }
  };
}

/* ---------- travel ---------- */
const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * 920, y: Math.random() * 560, s: 0.3 + Math.random() }));

}
function checkWin() { if (!S.won && S.homes >= 10 && S.farms >= 1 && S.caves >= 1) { S.won = true; refreshHud();
  popups(['COLONY ESTABLISHED! 10 HOMES, A FARM AND A CAVE ARE UP AND RUNNING.', 'YOUR RESIDENTS KEEP MINING FOR YOU. SELL THEIR FINDS AT THE BAZAAR. MORE COMING SOON.']); } }
const disc = (x, cx, cy, r, col) => { x.fillStyle = col; for (let y = -r; y <= r; y++) for (let a = -r; a <= r; a++) if (a * a + y * y <= r * r) x.fillRect(cx + a, cy + y, 1, 1); };
function drawColony() {

/* ---------- generated travel animation: ship + exhaust + gliding pixel stars ---------- */
function startTravel(to) { S.travel = { to, t: 0, dur: sysOf(S.loc) === sysOf(to) ? 2 : T.travelSeconds, sp: [] }; S.view = 'travel'; render(); }
function renderTravel(el) { el.innerHTML = '<canvas id="tc" width="920" height="560" style="position:absolute;inset:0"></canvas><div class="tbar" id="tt"></div>'; }
function tickTravel(dt) {

  const c = $('#tc').getContext('2d'), sp = SHIPS[S.type], spr = S._spr && S._spr.t === S.type ? S._spr.c : (S._spr = { t: S.type, c: shipSprite(S.type) }).c;
  c.imageSmoothingEnabled = false; c.fillStyle = '#02030a'; c.fillRect(0, 0, 920, 560);
  for (let i = 0; i < 6; i++) { c.fillStyle = 'rgba(90,60,160,.14)'; const nx = ((i * 211 - tr.t * 20) % 1100 + 1100) % 1100 - 100; c.fillRect(Math.round(nx / 8) * 8, 60 + i * 80, 160 + i * 20, 48); }
  for (const s of stars) { s.x -= s.s * (warp ? 1100 : 220) * dt; if (s.x < -80) { s.x = 940; s.y = Math.random() * 560; }
    const z = s.s < .6 ? 4 : s.s < 1 ? 8 : 12; c.fillStyle = s.s < .6 ? '#667' : s.s < 1 ? '#bbb' : '#fff'; c.fillRect(Math.round(s.x / 4) * 4, Math.round(s.y / 4) * 4, warp ? z * 4 : z, 4); }
  const sc = 6, bob = Math.round(Math.sin(tr.t * 3) * 2) * 4, sx = 200, sy = 280 - 14 * sc + bob;
  engY(sp).forEach(ey => { const fy = sy + ey * sc, len = 7 + (Math.random() * 5 | 0) + (warp ? 4 : 0);
    ['#fff', '#fff3b0', '#ffd24a', '#ff9d3c', '#ff5a2a', '#a02a1a', '#601810'].forEach((col, k) => { const l = Math.min(len, 3 + k * 2); c.fillStyle = col; c.fillRect(sx + 4 * sc - l * sc + 6 * sc * 0, fy, 0, 0); });
    for (let k = 0; k < len; k++) { c.fillStyle = ['#fff', '#fff3b0', '#ffd24a', '#ff9d3c', '#ff5a2a', '#a02a1a', '#601810'][Math.min(6, k >> 1)]; const h = k < 3 ? sc : k < 7 ? sc - 2 : 4; c.fillRect(sx + 3 * sc - (k + 1) * sc, fy + (sc - h) / 2, sc, h); }
    tr.sp.push({ x: sx + 2 * sc, y: fy + 2, vx: -(250 + Math.random() * 300), vy: (Math.random() - .5) * 60, l: 1 }); });
  tr.sp = tr.sp.filter(p => (p.l -= dt * 1.6) > 0); for (const p of tr.sp) { p.x += p.vx * dt; p.y += p.vy * dt; c.fillStyle = p.l > .5 ? '#ffb347' : '#ff5a2a'; c.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, 4, 4); }

/* ---------- tutorial complete card ---------- */
function showComplete() {

    () => popup('NEXT: TRAVEL TO FARPORT AND VISIT THE HUT. A SKETCHY GUY HAS A PROPOSAL FOR YOU.', 'OK'));

/* ---------- map (several planets per system) ---------- */
const mapPlanets = () => SYSTEMS.flatMap(s => s.planets.filter(p => p.id !== 'home' || S.planet).map(p => ({ s, p })));
function sysOf(loc) { return SYSTEMS.find(s => s.planets.some(p => p.id === loc)) || SYSTEMS[0]; }
function planetPos(s, p, t) { const a = p.angle + t * p.speed; return proj(s.x + Math.cos(a) * p.orbit, s.y + Math.sin(a) * p.orbit); }

  const el = $('#mp'); if (!el) return; const p = M.sel; if (!p) { el.innerHTML = '<div class="box sm">CLICK A PLANET</div>'; return; }

  const a = proj(SYSTEMS[0].x, SYSTEMS[0].y), b = proj(SYSTEMS[1].x, SYSTEMS[1].y);
  x.strokeStyle = '#444'; x.setLineDash([6, 8]); x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); x.setLineDash([]);

    x.fillStyle = '#f5a623'; x.beginPath(); x.arc(c0.x, c0.y, s.sun, 0, 6.283); x.fill();

/* ---------- main loop ---------- */
function tick(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;

/* ---------- exploration: new systems with planets ---------- */
function pickType() { let r = Math.random(); for (const t of TYPES) { if (r < t[2]) return t; r -= t[2]; } return TYPES[0]; }
function genSystem() {
  const n = ++S.dn, t = pickType(), pl = rnd(POOL), far = 20 + Math.floor(Math.random() * 161), h = t[0] === 'mobs' ? Math.random() * 20 : Math.random() * 360;
  const pal = hsl(h, .55, .55), pal2 = hsl((h + 40) % 360, .6, .3), mk = 'm' + n, ang = Math.random() * 6.283, dist = 420 + far * 3.2, id = 'd' + n;
  MATS[mk] = { n: pl[0], base: Math.round(pl[1] * (t[0] === 'anomaly' ? 1.6 : 1)) };
  const p = { id, name: rname(), r: 5 + Math.random() * 5, color: `rgb(${pal})`, angle: Math.random() * 6.283, speed: .2 + Math.random() * .4, orbit: 36 + Math.random() * 40, type: t[0], mat: mk,
    lvl: 1 + Math.random() * 5 | 0, mobName: rnd(['VOID WASPS', 'PIRATE RAIDERS', 'CRYSTAL HOUNDS', 'RUST DRONES', 'NEBULA LEECHES']), pal, pal2, seed: 100 + n * 13, looted: false, visited: false, cd: 0 };
  const sys = { id: 's' + n, name: rname() + ' SYSTEM', x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, sun: 10 + Math.random() * 8, col: rnd(['#f5a623', '#ff6b6b', '#7fdcff', '#fff3b0', '#c77dff']), far, discovered: true, planets: [p] };
  SYSTEMS.push(sys); PLACES[id] = { name: p.name, sub: t[1] }; save(); return { sys, p, t };
}
function scanAnim(ms, cb) {
  const x = $('#fx').getContext('2d'), t0 = performance.now();
  (function f(n) { const t = (n - t0) / ms; x.clearRect(0, 0, 920, 560); if (t >= 1) return cb();
    for (let k = 0; k < 3; k++) { const r = ((t * 1.4 + k * .33) % 1) * 300; x.fillStyle = `rgba(255,255,255,${1 - r / 300})`; for (let a = 0; a < 360; a += 3) { const q = a * Math.PI / 180; x.fillRect(Math.round((460 + Math.cos(q) * r) / 4) * 4, Math.round((280 + Math.sin(q) * r) / 4) * 4, 4, 4); } }
    x.fillStyle = '#fff'; x.font = '700 20px Ubuntu'; x.textAlign = 'center'; x.fillText('SCANNING THE DARK...', 460, 70); requestAnimationFrame(f); })(t0);
}
function explore() {
  if (exploring) return; if (S.zeals < 150) { toast('NEED 150 Z FOR FUEL'); return; }
  S.zeals -= 150; refreshHud(); exploring = true; scanAnim(2500, () => { exploring = false; resolveExplore(); });
}
function hostile(text, lp) {
  choice(text, [[`RUN (${Math.round(thrustP() * 100)}% THRUST)`, () => { if (Math.random() < thrustP()) popup('YOU BURN HARD AND ESCAPE!'); else popup(`THEY CAUGHT YOU AND TOOK ${loseZ(lp)} Z.`); }],
    ['FIGHT', () => { const w = clamp(.35 + .12 * S.up.weapon + .03 * S.up.armor + SHIPS[S.type].cmb, .1, .85);
      if (Math.random() < w) { const g = 400 + Math.random() * 1100 | 0; S.zeals += g; refreshHud(); popup(`VICTORY! YOU SALVAGED ${g} Z FROM THE WRECKS.`); } else popup(`YOU LOST THE FIGHT AND ${loseZ(lp * 1.2)} Z.`); }]]);
}
function resolveExplore() {
  const r = Math.random();
  if (r < .15) return hostile('HOSTILE TERRITORY! AN ARMED PATROL LOCKS ONTO YOUR SHIP.', .1);
  if ((r - .15) / .85 < rangeP()) { const { sys, p, t } = genSystem(), secs = Math.round(sys.far * travelMult());
    return choice(`PLANET FOUND: ${p.name} (${t[1]}) IN THE ${sys.name}. IT IS ${sys.far} UNITS AWAY: ABOUT ${secs} SECONDS FOR YOUR SHIP. IT WAS ADDED TO YOUR MAP.`, [['TRAVEL NOW', () => startTravel(p.id)], ['LATER', () => {}]]); }
  if (Math.random() < .12) { const l = rnd(LORE), g = 250 + Math.random() * 650 | 0; S.zeals += g; S.lore.push(l); refreshHud(); return popups(['GHOST SIGNAL DETECTED...', `YOU DECODE IT: ${l}`, `A FORGOTTEN BEACON PAYS OUT ${g} Z.`]); }
  popup(rnd(['NOTHING BUT EMPTY DARK. THE SCANNERS FOUND NOTHING THIS TIME.', 'ONLY STATIC AND STARDUST. TRY AGAIN.', 'A QUIET SECTOR. NOTHING OF INTEREST.']));
}

function mineD(dt) {

/* ---------- travel: routes with risk, long exploration trips, generated animation ---------- */
const baseDur = (a, b) => { const sa = sysOf(a), sb = sysOf(b); return sa === sb ? 2 : Math.max(sa.far || 0, sb.far || 0) || T.travelSeconds; };
function startTravel(to, mode) {
  const dur = Math.max(1, baseDur(S.loc, to) * travelMult() * (mode === 'safe' ? 1.6 : 1));
  S.travel = { to, t: 0, dur, sp: [], risky: mode === 'short' }; S.view = 'travel'; render();
}
function routeEvent() {
  const ev = Math.random() * 3 | 0;
  if (ev === 0) popup(Math.random() < thrustP() ? 'ASTEROID FIELD! YOU THREADED THROUGH WITH A STEADY HAND.' : `ASTEROID FIELD! HULL DAMAGE COSTS ${loseZ(.05)} Z IN REPAIRS.`);
  else if (ev === 1) hostile('PIRATE PATROL ON THE SHORT ROUTE! THEY DEMAND YOUR ZEALS.', .08);
  else popup(Math.random() < .18 * S.up.armor ? 'SOLAR FLARE! YOUR DEFENSES ABSORB THE BLAST.' : `SOLAR FLARE! SCORCHED SYSTEMS COST ${loseZ(.04)} Z.`);
}

/* ---------- menu: contracts, cargo, ship, stats, settings ---------- */
let menuOpen = false;
function toggleMenu() { const m = $('#menu'); if (S.view === 'name') return; menuOpen = !menuOpen; m.hidden = !menuOpen; if (menuOpen) menuUI(); }
function menuUI() {
  const m = $('#menu'), st = S.stats, inv = Object.keys(S.inv).filter(k => S.inv[k] > 0 && MATS[k]);
  const ACH = [['FIRST CONTRACT', st.jobs >= 1], ['10 CONTRACTS', st.jobs >= 10], ['100K ZEALS EARNED', st.earned >= 100000], ['EXPLORER: 3 SYSTEMS', S.dn >= 3], ['500 KLY TRAVELLED', st.dist >= 500], ['MINER: 500 ORE', st.mined >= 500]];
  m.innerHTML = `<div class="mh"><b>MENU</b><button class="btn sec" id="mx">CLOSE</button></div><div class="mg">
    <div><b>CONTRACTS</b>${S.act.map((j, i) => `<div class="ln sm"><span>${j.need} x ${MATS[j.mat].n} - ${fmt(j.left)}</span><button class="btn dng" data-mab="${i}">ABANDON</button></div>`).join('') || '<div class="sm">NONE ACTIVE</div>'}<div class="sm">STANDING: ${repName()} (${S.rep})</div></div>
    <div><b>CARGO ${cargoUsed()}/${cargoCap()}</b>${inv.map(k => `<div class="ln sm"><span>${MATS[k].n} x${S.inv[k]}</span><button class="btn dng" data-dr="${k}">DROP</button></div>`).join('') || '<div class="sm">EMPTY</div>'}</div>
    <div><b>SHIP: ${SHIPS[S.type].n}</b><div class="sm">${perkText(S.type)}<br>UPGRADES: ${UPG.map(u => u[1].slice(0, 3) + ' ' + S.up[u[0]]).join(' | ')}<br>FUEL ${Math.ceil(S.fuel)}/${fuelMax()}</div></div>
    <div><b>STATS</b><div class="sm">CONTRACTS ${st.jobs} | ORE ${st.mined} | ${st.dist} KLY | SYSTEMS ${S.dn}</div>${ACH.map(a => `<div class="sm">${a[1] ? '&#10003;' : '&#9633;'} ${a[0]}</div>`).join('')}</div>
    <div><b>SETTINGS</b><div class="ln sm"><span>VOLUME</span><input type="range" id="vol" min="0" max="100" value="${Math.round(S.vol * 100)}"></div><div class="ln sm"><span>REDUCED MOTION</span><input type="checkbox" id="rm" ${S.rm ? 'checked' : ''}></div><button class="btn sec" id="fs">FULLSCREEN</button></div></div>
    <div class="row"><button class="btn dng" id="ng">NEW GAME</button></div><div class="sm" style="text-align:center">CELESTIA v1.3 - ESC: MENU - M: MAP</div>`;
  $('#mx').onclick = toggleMenu;
  $$('[data-mab]').forEach(b => b.onclick = () => choice('ABANDON THIS CONTRACT? STANDING -1.', [['ABANDON', () => { S.act.splice(+b.dataset.mab, 1); S.rep = Math.max(0, S.rep - 1); syncHud(); menuUI(); }], ['KEEP', () => {}]]));
  $$('[data-dr]').forEach(b => b.onclick = () => choice(`DROP ALL ${S.inv[b.dataset.dr]} ${MATS[b.dataset.dr].n}? IT WILL BE LOST.`, [['DROP', () => { S.inv[b.dataset.dr] = 0; syncHud(); menuUI(); }], ['KEEP', () => {}]]));
  $('#vol').oninput = e => { S.vol = e.target.value / 100; if (AC) GN.gain.value = .045 * S.vol; };
  $('#rm').onchange = e => { S.rm = e.target.checked; $('#stage').classList.toggle('rm', S.rm); };
  $('#fs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); };
  $('#ng').onclick = () => choice('START A NEW GAME? YOUR SAVED PROGRESS WILL BE ERASED.', [['ERASE & RESTART', () => { resetGame(); }], ['CANCEL', () => {}]]);
}
addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(); if ((e.key === 'm' || e.key === 'M') && S.mapUnlocked && ['planet', 'map'].includes(S.view) && !e.target.matches('input')) { S.view = S.view === 'map' ? 'planet' : 'map'; render(); } });

/* ---------- ambient planet animation, transitions, render hook ---------- */
function drawAmb(t) {
  const c = $('#amb'); if (!c) return; const x = c.getContext('2d'); x.clearRect(0, 0, 460, 280);
  for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(255,255,255,${(.3 + .7 * Math.abs(Math.sin(t * .8 + i * 1.7))) * .6})`; x.fillRect((i * 83) % 460, (i * 47) % 280, 1, 1); }
  const key = S.type + JSON.stringify(S.paint); if (!S._amb || S._amb.k !== key) S._amb = { k: key, c: shipSprite(S.type, S.paint) };
  const p = ((t * 16) % 900) - 220, y = 40 + Math.sin(t) * 4; x.drawImage(S._amb.c, p, y, 110, 55); x.fillStyle = 'rgba(143,211,255,.55)'; x.fillRect(p - 12, y + 26, 12, 2);
}
let _lk = ''; const _rd = render;
render = function () { const k = S.view + '|' + S.loc + '|' + !!S.inside; if (k !== _lk) { _lk = k; const w = $('#wipe'); if (w) { w.classList.remove('go'); void w.offsetWidth; w.classList.add('go'); } }
  _rd(); if (S.view === 'planet' && !S.inside && !S.rm) $('#screen').insertAdjacentHTML('beforeend', '<canvas id="amb" class="amb" width="460" height="280"></canvas>');
  const mb = $('#mbtn'); if (mb) mb.style.display = S.view === 'name' ? 'none' : ''; };
function checkPlay() { playable = true; $('#guard').hidden = true; const s = Math.min(innerWidth / 920, innerHeight / 560); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }

/* ---------- main simulation: also runs while the tab is in the background ---------- */
let _sc2 = 0;
function produce(dt) {
  S.sv += dt; if (S.sv > 4) { S.sv = 0; save(); }
  S.mkT += dt; if (S.mkT > 15) { S.mkT = 0; driftMarket(); if (S.view === 'planet' && S.loc === 'bazaar' && S.inside) shopUI(); }
  if (S.step >= 11) { S.boardT -= dt; if (!S.board.length || S.boardT <= 0) genBoard(); }
  if (S.cd > 0) S.cd -= dt;
  for (let i = S.act.length - 1; i >= 0; i--) { S.act[i].left -= dt; if (S.act[i].left <= 0) { const j = S.act.splice(i, 1)[0]; S.rep = Math.max(0, S.rep - 1); syncHud(); popup(`CONTRACT EXPIRED: ${j.need} x ${MATS[j.mat].n}. YOUR STANDING DROPS.`); if (S.view === 'hut') jobsUI(); } }
  if (S.zeals - lastZ >= 200) ching(); lastZ = S.zeals;
  _sc2 += dt; if (_sc2 >= 1) { _sc2 = 0; syncHud(); $$('[data-lt]').forEach(e => { const j = S.act[+e.dataset.lt]; if (j) e.textContent = fmt(j.left); }); const bt = $('.jb .sm'); const p = isD(S.loc) && findP(S.loc);
    setMood(S.view === 'travel' ? 'travel' : p && p.type === 'mobs' ? 'tense' : 'calm'); }
}
function sim(dt) {
  if (S.view === 'travel' && S.travel) tickTravel(dt);
  else if (S.view === 'map') { if (!document.hidden) drawMap(); }
  else if (S.view === 'planet') {
    if (S.mining && S.loc === 'korr' && S.step < 11 && canMine()) { S.ore = Math.min(S.need, S.ore + T.mineRate * mineMult() * dt); updateOre(); if (S.ore >= S.need) finishMine(); }
    else if (S.mining && (isD(S.loc) || (S.loc === 'korr' && S.step >= 11))) mineD(dt);
    if (!document.hidden) drawAmb(performance.now() / 1000);
  }
  produce(dt);
}
function tick(now) { const dt = Math.min(300, (now - last) / 1000); last = now; sim(dt); drawFx(dt); requestAnimationFrame(tick); }

/* ---------- start: auto-continue the last run ---------- */
$('#stage').insertAdjacentHTML('beforeend', '<canvas id="fx2" width="920" height="560"></canvas><div id="wipe"></div><div id="menu" hidden></div><button class="btn sec" id="mbtn">MENU</button>');
$('#mbtn').onclick = toggleMenu;
checkPlay(); if (!(hasSave() && loadGame())) render(); shownZ = S.zeals; lastZ = S.zeals; last = performance.now();
requestAnimationFrame(tick);
setInterval(() => { if (document.hidden) { const n = performance.now(), dt = Math.min(300, (n - last) / 1000); last = n; sim(dt); } }, 500);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); }); addEventListener('pagehide', () => save());

</script>
<script>
/* Celestia 1.4: full reset, Light Speed Booster, secret ship, captain levels, keys & chests */
(d => { for (const k in d) if (S[k] === undefined) S[k] = d[k]; })({ xp: 0, lvl: 1, bf: 0, bc: 0, bm: 0, bs: 0, pend: 0, god: 0, lsb: 0, keys: { common: 0, rare: 0, epic: 0, legend: 0 }, chests: { common: 0, rare: 0, epic: 0, legend: 0 } });

/* ---------- reset: wipe the save for good and reload to the title ---------- */
let _noSave = false;
const _save0 = save; save = function () { if (_noSave) return; _save0(); };
function resetGame() { _noSave = true; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }

/* ---------- Bazaar: Light Speed Booster (20,000 Z, travel 10x faster) ---------- */
const _shop7 = shopUI;
shopUI = function () {
  _shop7(); const sh = $('#sh'); if (!sh) return;
  sh.insertAdjacentHTML('beforeend', `<b>PROPULSION</b><div class="ln"><span>LIGHT SPEED BOOSTER <span class="sm">TRAVEL 10x FASTER</span></span><button class="btn pri" id="lsb" ${S.lsb || S.zeals < 20000 ? 'disabled' : ''}>${S.lsb ? 'INSTALLED' : '20,000 Z'}</button></div>`);
  $('#lsb').onclick = () => { if (S.zeals >= 20000 && !S.lsb) { S.zeals -= 20000; S.lsb = 1; syncHud(); shopUI(); toast('LIGHT SPEED BOOSTER INSTALLED!'); save(); } };
};

/* ---------- secret ship: name your ship TheDeathRazer45 ---------- */
SPEC.push({ c: '#d4af37', a: '#8a6a12', p: [[8, 24], [24, 29], [120, 16], [196, 1.5]], w: [], eng: 5, tower: 26, tur: [44, 62, 80, 98, 116, 134, 152], win: 2, stripe: 1 });
PERK.push([.2, 3, .5, .95, 5000, .5]); FUEL.push([9999, .1]); TAGS.push('SECRET');
SHIPS.push({ n: 'THE DEATH RAZER', d: 'A gold Executer-class super dreadnought. Only buffs, no limits.', c: '#d4af37', trv: .2, mine: 3, rng: .5, thr: .95, cargo: 5000, cmb: .5 });

/* ---------- captain level & XP ---------- */
const xpNeed = l => 100 + 70 * (l - 1), TITLES = { 10: 'PILOT', 20: 'COMMANDER', 30: 'CAPTAIN', 40: 'ADMIRAL', 50: 'LEGEND' };
const titleOf = () => { let t = 'ROOKIE'; for (const k in TITLES) if (S.lvl >= +k) t = TITLES[k]; return t; };
let _lvBusy = false;
function addXP(n) { S.xp += n; let up = 0; while (S.lvl < 50 && S.xp >= xpNeed(S.lvl)) { S.xp -= xpNeed(S.lvl); S.lvl++; up++; if (TITLES[S.lvl]) toast('TITLE UNLOCKED: ' + TITLES[S.lvl]); }
  if (S.lvl >= 50) S.xp = Math.min(S.xp, xpNeed(49)); S.pend += up; if (up && !_lvBusy) levelUp(); }
function levelUp() {
  if (S.pend <= 0) { _lvBusy = false; return; } _lvBusy = true; const L = S.lvl - S.pend + 1; S.pend--;
  choice(`<b>LEVEL UP! CAPTAIN LEVEL ${L}</b><br>PICK A PERMANENT BONUS:`, [['FUEL EFFICIENCY -2%', () => { S.bf++; levelUp(); }], ['CARGO +10', () => { S.bc++; levelUp(); }], ['MINING +3%', () => { S.bm++; levelUp(); }], ['SCAN RANGE +1%', () => { S.bs++; levelUp(); }]]);
}
const _hud7 = hud; hud = function () { return _hud7().replace('<span class="sm">', `<span class="sm" id="hlv">LV ${S.lvl} - `); };
const _sync7 = syncHud; syncHud = function () { _sync7(); const e = $('#hlv'); if (e) { const t = `LV ${S.lvl} - ${SHIPS[S.type].n.split(' / ')[0]}`; if (e.textContent !== t) e.textContent = t; } };

/* ---------- keys, chests & loot ---------- */
const KT = ['common', 'rare', 'epic', 'legend'], KC = ['#9aa0a6', '#4da3ff', '#b07bff', '#ffb43a'];
function dropLoot(src, tier) {
  const w = src === 'wreck' ? [.4, .3, .12, .03] : src === 'mob' ? [.45, .15, .05, .01] : [.3, .08, .02, .005], got = [];
  KT.forEach((k, i) => { if (Math.random() < w[i] * (1 + .1 * tier)) { S.keys[k]++; got.push(k.toUpperCase() + ' KEY'); } });
  if (src === 'wreck' && Math.random() < .6) { const k = KT[Math.random() < .7 ? 0 : Math.random() < .7 ? 1 : 2]; S.chests[k]++; got.push(k.toUpperCase() + ' CHEST'); }
  if (got.length) toast('FOUND: ' + got.join(', '));
}
const keyFor = i => { for (let q = i; q < 4; q++) if (S.keys[KT[q]] > 0) return q; return -1; };
function openChest(k) {
  const i = KT.indexOf(k), ki = keyFor(i); if (ki < 0 || S.chests[k] < 1) return; S.keys[KT[ki]]--; S.chests[k]--; const R = (a, b) => a + Math.floor(Math.random() * (b - a)); let t;
  if (i === 0) { const r = Math.random(); if (r < .4) { const z = R(100, 400); S.zeals += z; t = `${z} ZEALS`; } else if (r < .7) { const f = R(8, 18); S.fuel = Math.min(fuelMax(), S.fuel + f); t = `${f} FUEL`; } else { const n = R(8, 20); S.inv.lunarrite = (S.inv.lunarrite || 0) + n; t = `${n} LUNARRITE`; } }
  else if (i === 1) { const z = R(400, 1200), n = R(10, 20); S.zeals += z; S.inv.lunarrite = (S.inv.lunarrite || 0) + n; S.fuel = Math.min(fuelMax(), S.fuel + 20); t = `${z} ZEALS, ${n} LUNARRITE AND 20 FUEL`; }
  else if (i === 2) { const z = R(1500, 4000); S.zeals += z; MATS.core = MATS.core || { n: 'ANCIENT CORE', base: 900 }; S.inv.core = (S.inv.core || 0) + 1; t = `${z} ZEALS AND AN ANCIENT CORE`; }
  else { const open = Object.keys(S.up).filter(u => S.up[u] < 5), u = open.length ? rnd(open) : null; S.zeals += 6000; if (u) S.up[u]++; t = `6000 ZEALS${u ? ' AND A FREE ' + u.toUpperCase() + ' UPGRADE' : ''}`; }
  addXP(25 * (i + 1)); syncHud(); popup(`<b style="color:${KC[i]}">${k.toUpperCase()} CHEST OPENED!</b><br>YOU GOT ${t}.`); menuUI();
}
const _mu7 = menuUI;
menuUI = function () {
  _mu7(); const g = $('.mg'); if (!g) return;
  g.insertAdjacentHTML('beforeend', `<div><b>CAPTAIN LV ${S.lvl} - ${titleOf()}</b><div class="sm">XP ${Math.floor(S.xp)}/${xpNeed(S.lvl)}<br>BONUSES: FUEL -${2 * S.bf}% | CARGO +${10 * S.bc} | MINING +${3 * S.bm}% | SCAN +${S.bs}%</div></div>
    <div><b>KEYS &amp; CHESTS</b>${KT.map((k, i) => `<div class="ln sm"><span style="color:${KC[i]}">${k.toUpperCase()}</span><span>KEYS ${S.keys[k]} | CHESTS ${S.chests[k]}</span><button class="btn" data-oc="${k}" ${S.chests[k] && keyFor(i) >= 0 ? '' : 'disabled'}>OPEN</button></div>`).join('')}<div class="sm">A CHEST NEEDS A KEY OF THE SAME OR HIGHER TIER.</div></div>`);
  $$('[data-oc]').forEach(b => b.onclick = () => openChest(b.dataset.oc));
};

/* ---------- XP & loot hooks ---------- */
const _hunt7 = hunt; hunt = function (p) { const z = S.zeals; _hunt7(p); if (S.zeals > z) { addXP(30 + p.lvl * 20); dropLoot('mob', p.lvl); } };
const _salv7 = salvage; salvage = function (p) { _salv7(p); addXP(90); dropLoot('wreck', 3); };
const _gen7 = genSystem; genSystem = function () { const r = _gen7(); addXP(60); return r; };
const _del7 = deliver; deliver = function (i) { const j = S.act[i], n = S.act.length; _del7(i); if (j && S.act.length < n) { addXP(30 + (j.need / 2 | 0)); dropLoot('job', 1); } };
const _mine7 = mineD; mineD = function (dt) { const m = S.stats.mined; _mine7(dt); if (S.stats.mined > m) addXP((S.stats.mined - m) * .25); };
render(); if (S.pend > 0) setTimeout(levelUp, 800);

</script>
