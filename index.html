<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Celestia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; image-rendering: pixelated; }
html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
  font-family: 'Press Start 2P', monospace; font-size: 10px; line-height: 1.6; }
/* Stage is 11.5 : 7 -> 920 x 560, scaled by JS to fit the tab */
#stage { position: absolute; left: 50%; top: 50%; width: 920px; height: 560px;
  transform-origin: center; background: #000; overflow: hidden; }
#screen { position: absolute; inset: 0; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hud { position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex;
  justify-content: space-between; align-items: center; padding: 0 12px; background: #000;
  border-bottom: 2px solid #fff; z-index: 5; }
.actions { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; gap: 12px;
  justify-content: center; z-index: 5; }
.btn { background: #000; color: #fff; border: 2px solid #fff; font: inherit; font-size: 10px;
  padding: 10px 14px; cursor: pointer; }
.btn:hover:not(:disabled) { background: #fff; color: #000; }
.btn:disabled { border-color: #555; color: #555; cursor: default; }
.box { background: #000; border: 2px solid #fff; padding: 14px; }
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 16px; text-align: center; }
h1 { font-size: 36px; margin: 0; letter-spacing: 6px; }
input { background: #000; color: #fff; border: 2px solid #fff; font: inherit; font-size: 12px;
  padding: 10px; width: 330px; text-align: center; outline: none; }
#popup { position: absolute; left: 90px; right: 90px; bottom: 70px; z-index: 20; background: #000;
  border: 2px solid #fff; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  align-items: flex-end; box-shadow: 0 0 0 4px #000; }
#popup .pt { width: 100%; line-height: 1.9; }
#popup[hidden], #guard[hidden] { display: none; }
#guard { position: fixed; inset: 0; z-index: 99; background: #000; color: #fff; display: flex;
  align-items: center; justify-content: center; text-align: center; padding: 24px; line-height: 2.2; }
.bar { width: 320px; height: 16px; border: 2px solid #fff; }
.bar > div { height: 100%; width: 0; background: #fff; }
.mid { position: absolute; left: 0; right: 0; top: 250px; display: flex; flex-direction: column;
  align-items: center; gap: 12px; z-index: 5; }
.panel { position: absolute; right: 12px; top: 46px; width: 250px; z-index: 6; display: flex;
  flex-direction: column; gap: 10px; }
.banner { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; z-index: 5; letter-spacing: 3px; }
canvas.map { position: absolute; inset: 0; cursor: grab; }
canvas.map:active { cursor: grabbing; }
.tbar { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; z-index: 5;
  background: #000; border-top: 2px solid #fff; border-bottom: 2px solid #fff; padding: 10px; }

/* ===== 1.1: Ubuntu UI, nicer look. Only animations/sprites stay pixelated ===== */
html, body, input, .btn { font-family: 'Ubuntu', system-ui, sans-serif; }
html, body { font-size: 15px; line-height: 1.5; }
.hud { height: 38px; font-weight: 500; background: linear-gradient(#000, #0a0a0a); letter-spacing: .5px; }
.btn { font-size: 14px; font-weight: 700; letter-spacing: 1px; padding: 10px 20px; border-radius: 8px;
  background: linear-gradient(#1c1c1c, #000); transition: transform .1s, background .15s, color .15s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(255,255,255,.35); }
.box { border-radius: 10px; background: rgba(0,0,0,.82); box-shadow: 0 6px 22px rgba(0,0,0,.7); }
input { font-size: 16px; border-radius: 8px; }
h1 { font-size: 58px; font-weight: 700; letter-spacing: 14px; margin: 0; text-shadow: 0 0 22px rgba(255,255,255,.5); }
#popup { font-size: 16px; border-radius: 12px; background: rgba(0,0,0,.92); box-shadow: 0 8px 40px rgba(0,0,0,.9), 0 0 0 1px #444; }
#guard { font-size: 20px; }
.bar { border-radius: 8px; overflow: hidden; height: 18px; } .sm { font-size: 12px; opacity: .8; }
.tl { position: absolute; left: 12px; top: 48px; z-index: 5; }
.sub { letter-spacing: 4px; opacity: .8; }
.row { display: flex; gap: 12px; }
.ships { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 880px; }
.sc { border: 2px solid #444; border-radius: 10px; padding: 6px 4px; cursor: pointer; background: #050505; font-size: 10px; font-weight: 700; transition: .12s; }
.sc:hover { border-color: #aaa; } .sc.on { border-color: #fff; background: #1a1a1a; box-shadow: 0 0 16px rgba(255,255,255,.4); transform: translateY(-3px); }
.sc canvas { width: 104px; height: 56px; display: block; margin: 0 auto 4px; }
.sd { min-height: 40px; width: 700px; opacity: .9; }
.moss { position: absolute; width: 72px; height: 54px; cursor: grab; z-index: 6; touch-action: none; user-select: none; }
.shop { position: absolute; left: 12px; top: 110px; width: 430px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.shop .ln { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.shop .btn { padding: 6px 12px; font-size: 12px; }
.toast { position: absolute; right: 14px; top: 50px; z-index: 40; background: #fff; color: #000; padding: 6px 12px; border-radius: 8px; font-weight: 700; animation: fl 2.4s forwards; }
@keyframes fl { to { transform: translateY(-22px); opacity: 0; } }
.hp { position: absolute; right: 12px; top: 48px; width: 270px; z-index: 5; }

/* ===== 1.2 ===== */
.sc canvas { width: 128px; height: 64px; }
.row { flex-wrap: wrap; justify-content: center; max-width: 880px; }
.shop2 { position: absolute; right: 12px; top: 110px; width: 400px; z-index: 5; display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
.sw { width: 26px; height: 26px; border: 2px solid #fff; border-radius: 6px; cursor: pointer; padding: 0; }
.sw.on { outline: 2px solid #fff; outline-offset: 2px; }
#mute { position: absolute; left: 10px; bottom: 10px; z-index: 25; padding: 6px 10px; font-size: 11px; }
.bg { animation: landz .9s ease-out; }
@keyframes landz { from { transform: scale(1.35); opacity: .2; } to { transform: scale(1); opacity: 1; } }
.shop, .shop2 { top: 148px; }
.shop2 { max-height: 390px; }

</style>
</head>
<body>
<div id="guard" hidden></div>
<div id="stage">
  <div id="screen"><div id="boot" style="padding:24px;line-height:2">LOADING CELESTIA...</div></div>
  <div id="popup" hidden></div>
  <canvas id="fx" width="920" height="560"></canvas>
</div>
<script>
function bootFail(f){document.getElementById('boot')&&(document.getElementById('boot').innerHTML='ERROR: COULD NOT LOAD '+f+'<br>UPLOAD ALL FILES TO THE REPO ROOT: index.html, style.css, data.js, game.js, game2.js, game3.js, game4.js');}
window.addEventListener('error',function(e){if(e.target&&e.target.src)bootFail(e.target.src.split('/').pop());},true);
</script>
<script>
// Celestia - data & story text
const FIRST_NAMES = ['Silent','Crimson','Lunar','Iron','Rogue','Drifting','Hollow','Bright','Wandering','Quiet','Rusty','Stellar','Pale','Wild'];
const LAST_NAMES  = ['Comet','Sparrow','Voyager','Lantern','Falcon','Meridian','Harbor','Tide','Ember','Wren','Horizon','Nomad','Pilgrim','Spark'];

const TUNING = {
  minerRate: 0.5,      // Retro Miner: 0.5 per second
  toughness: 0.3,      // Lunarrite toughness
  need: 50,            // lunarrite required
  reward: 5000,        // Zeals
  warpSeconds: 2,      // travel animation length
  travelSeconds: 5     // Port <-> Lear = 5 kilayears = 5 seconds
};
// mining speed = miner rate / toughness  (0.5 / 0.3 = 1.667 per second)
TUNING.mineRate = TUNING.minerRate / TUNING.toughness;

const PLACES = {
  farport: { name: 'FARPORT', sub: 'JOB HUB PLANET' },
  korr:    { name: 'KORR',    sub: 'LUNARRITE MINING PLANET' },
  bazaar:  { name: 'BAZAAR',  sub: 'SHOP PLANET' },
  home:    { name: 'HOME',    sub: 'YOUR PLANET' }
};

const SYSTEMS = [
  { id: 'port', name: 'PORT SYSTEM', x: -240, y: 0, sun: 16, planets: [
    { id: 'farport', name: 'FARPORT', r: 11, color: '#f7d878', angle: 0.7, speed: 0.25, orbit: 95 },
    { id: 'bazaar', name: 'BAZAAR', r: 8, color: '#5fb6c8', angle: 3.6, speed: 0.4, orbit: 58 } ] },
  { id: 'lear', name: 'LEAR SYSTEM', x: 240, y: 0, sun: 13, planets: [
    { id: 'korr', name: 'KORR', r: 5.5, color: '#9a9a9a', angle: 2.4, speed: 0.35, orbit: 66 },
    { id: 'home', name: 'HOME', r: 6.5, color: '#6bc57a', angle: 5.1, speed: 0.5, orbit: 40 } ] }
];

</script>
<script>
// Celestia - game logic
const $ = s => document.querySelector(s);
const T = TUNING;
const S = { ship: '', loc: 'farport', step: 0, ore: 0, zeals: 0, mining: false,
            view: 'name', mapUnlocked: false, travel: null };
/* Tutorial steps:
 0 name ship | 1 find the client at Farport | 2 travel to Korr | 3 mine 50 lunarrite
 4 return to Farport | 5 deliver at the hut | 6 leave into space | 7 tutorial complete */

let playable = false, last = performance.now();
const rnd = a => a[Math.floor(Math.random() * a.length)];
const randName = () => rnd(FIRST_NAMES) + ' ' + rnd(LAST_NAMES);

/* ---------- tab pause / scaling ---------- */
function checkPlay() {
  const w = innerWidth, h = innerHeight;
  playable = !document.hidden;
  const g = $('#guard');
  g.hidden = playable;
  if (!playable) g.innerHTML = 'PAUSED<br>RETURN TO THIS TAB';
  // stage keeps its 11.5:7 layout and scales to fit any tab size
  const s = Math.min(w / 920, h / 560);
  $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', checkPlay);
document.addEventListener('visibilitychange', checkPlay);

/* ---------- popups ---------- */
function popup(text, label, cb) {
  const p = $('#popup'); p.hidden = false;
  p.innerHTML = `<div class="pt">${text}</div><button class="btn" id="pb">${label || 'OK'}</button>`;
  $('#pb').onclick = () => { p.hidden = true; cb && cb(); };
}
function popups(list, done) {
  const next = i => i >= list.length ? (done && done()) :
    popup(list[i], i === list.length - 1 ? 'OK' : 'NEXT', () => next(i + 1));
  next(0);
}

/* ---------- HUD ---------- */
function questText() {
  return ['', 'QUEST: FIND THE CLIENT', 'QUEST: GO TO KORR',
    `QUEST: MINE LUNARRITE ${Math.floor(S.ore)}/${T.need}`, 'QUEST: RETURN TO FARPORT',
    'QUEST: DELIVER TO THE HUT', 'QUEST: LEAVE INTO SPACE', 'TUTORIAL COMPLETE'][S.step] || '';
}
const hud = () => `<div class="hud"><span>${S.ship}</span><span id="qt">${questText()}</span><span>${S.zeals.toLocaleString()} Z</span></div>`;

/* ---------- screens ---------- */
function render() {
  S.mining = false;
  const el = $('#screen');
  if (S.view === 'name') return renderName(el);
  if (S.view === 'planet') return renderPlanet(el);
  if (S.view === 'hut') return renderHut(el);
  if (S.view === 'travel') return renderTravel(el);
  if (S.view === 'map') return renderMap(el);
}

function renderName(el) {
  el.innerHTML = `<div class="center"><h1>CELESTIA</h1>
    <img src="${IMG.ship}" style="width:184px;height:112px;border:2px solid #fff">
    <div>NAME YOUR SHIP</div>
    <input id="nm" maxlength="24" value="${randName()}">
    <div style="display:flex;gap:12px"><button class="btn" id="rn">RANDOMIZE</button><button class="btn" id="go">LAUNCH</button></div></div>`;
  $('#rn').onclick = () => $('#nm').value = randName();
  $('#go').onclick = () => {
    S.ship = ($('#nm').value.trim() || randName()).toUpperCase();
    S.step = 1; S.view = 'planet'; S.loc = 'farport'; render();
    popups([`WELCOME, CAPTAIN OF THE ${S.ship}. THIS IS FARPORT, A JOB HUB PLANET.`,
      'JOBS COME FROM PEOPLE. SOMEONE HERE HAS ASKED FOR A PILOT. GO TO THEIR HUT.']);
  };
}

function renderPlanet(el) {
  const L = S.loc, P = PLACES[L];
  let acts = '', mid = '';
  if (L === 'farport') {
    if (S.step === 1 || S.step === 5) acts += `<button class="btn" id="hut">${S.step === 5 ? 'GO TO THE HUT (DELIVER)' : 'VISIT THE HUT'}</button>`;
    if (S.step === 2) acts += `<button class="btn" id="tk">TRAVEL TO KORR</button>`;
    if (S.step === 6) acts += `<button class="btn" id="leave">LEAVE INTO SPACE</button>`;
    if (S.step >= 7) acts += `<button class="btn" id="hut">VISIT THE HUT</button><button class="btn" id="map">OPEN MAP</button>`;
  } else {
    if (S.step === 3) {
      mid = `<div class="mid box"><div>LUNARRITE  TOUGHNESS ${T.toughness}</div>
        <div id="ore">${S.ore.toFixed(1)} / ${T.need}</div>
        <div class="bar"><div id="bar"></div></div></div>`;
      acts += `<button class="btn" id="mine">START MINING</button>`;
    }
    if (S.step === 4) acts += `<button class="btn" id="tf">TRAVEL TO FARPORT</button>`;
    if (S.step >= 7) acts += `<button class="btn" id="map">OPEN MAP</button>`;
  }
  el.innerHTML = `<img class="bg" src="${IMG[L]}">
    ${hud()}${mid}
    <div class="box" style="position:absolute;left:12px;top:46px;z-index:5">${P.name}<br><span style="font-size:8px">${P.sub}</span></div>
    <div class="actions">${acts}</div>`;
  const on = (id, f) => { const b = $('#' + id); if (b) b.onclick = f; };
  on('hut', () => { S.view = 'hut'; render(); });
  on('tk', () => startTravel('korr'));
  on('tf', () => startTravel('farport'));
  on('map', () => { S.view = 'map'; render(); });
  on('leave', leaveIntoSpace);
  on('mine', () => { S.mining = !S.mining; $('#mine').textContent = S.mining ? 'STOP MINING' : 'START MINING'; });
  updateOre();
}

function updateOre() {
  const o = $('#ore'); if (!o) return;
  o.textContent = `${S.ore.toFixed(1)} / ${T.need}`;
  $('#bar').style.width = (S.ore / T.need * 100) + '%';
  $('#qt').textContent = questText();
}

function renderHut(el) {
  let text, btn = '';
  if (S.step === 1) {
    text = `OLD TOBIN: "${S.ship}! I NEED ${T.need} LUNARRITE FROM KORR. I'LL PAY ${T.reward.toLocaleString()} ZEALS. BRING IT TO ME HERE."`;
    btn = '<button class="btn" id="ok">ACCEPT JOB</button>';
  } else if (S.step === 5) {
    text = `OLD TOBIN: "THAT'S ${T.need} LUNARRITE! HERE ARE YOUR ${T.reward.toLocaleString()} ZEALS."`;
    btn = '<button class="btn" id="ok">DELIVER LUNARRITE</button>';
  } else text = 'OLD TOBIN: "SAFE FLIGHTS, CAPTAIN."';
  el.innerHTML = `<div class="center"><div class="box" style="width:640px;line-height:2">${text}</div>
    <div style="display:flex;gap:12px">${btn}<button class="btn" id="bk">LEAVE HUT</button></div></div>${hud()}`;
  $('#bk').onclick = () => { S.view = 'planet'; render(); };
  const ok = $('#ok');
  if (ok) ok.onclick = () => {
    if (S.step === 1) {
      S.step = 2; S.view = 'planet'; render();
      popups(['JOB ACCEPTED: MINE 50 LUNARRITE ON KORR AND BRING IT BACK.',
        'PRESS TRAVEL TO KORR. THE JOURNEY TAKES 5 SECONDS.']);
    } else {
      S.step = 6; S.ore = 0; S.zeals += T.reward; S.view = 'planet'; render();
      popups([`JOB COMPLETE! +${T.reward.toLocaleString()} ZEALS.`, 'YOU ARE READY. PRESS LEAVE INTO SPACE.']);
    }
  };
}

/* ---------- travel ---------- */
const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * 920, y: Math.random() * 560, s: 0.3 + Math.random() }));
function startTravel(to) { S.travel = { to, t: 0 }; S.view = 'travel'; render(); }
function renderTravel(el) {
  // To use your own art, replace the values in assets.js (any image URL or data URI)
  el.innerHTML = `<canvas id="tc" width="920" height="560" style="position:absolute;inset:0"></canvas>
    <img id="warp" class="bg" src="${IMG.ship}">
    <div class="tbar" id="tt"></div>`;
}
function tickTravel(dt) {
  const tr = S.travel; tr.t += dt;
  const warping = tr.t < T.warpSeconds;
  const remain = Math.max(0, T.travelSeconds - Math.max(0, tr.t - T.warpSeconds));
  const w = $('#warp'), r = $('#rem'), tt = $('#tt'); if (!tt) return;
  if (w) w.style.display = warping ? 'block' : 'none';
  if (r) r.style.display = warping ? 'none' : 'block';
  tt.textContent = warping ? 'ENGAGING WARP...' : `TRAVELLING TO ${PLACES[tr.to].name}  -  ${remain.toFixed(1)} S REMAINING`;
  const c = $('#tc').getContext('2d'); c.fillStyle = '#000'; c.fillRect(0, 0, 920, 560); c.fillStyle = '#fff';
  for (const s of stars) { s.x -= s.s * (warping ? 900 : 120) * dt; if (s.x < -60) { s.x = 940; s.y = Math.random() * 560; }
    c.fillRect(s.x, s.y, warping ? 40 * s.s : 4, 4); }
  if (tr.t >= T.warpSeconds + T.travelSeconds) arrive(tr.to);
}
function arrive(dest) {
  S.loc = dest; S.travel = null; S.view = 'planet';
  if (dest === 'korr' && S.step === 2) {
    S.step = 3; render();
    popups(['THIS IS KORR. LUNARRITE HAS A TOUGHNESS OF 0.3.',
      `TOUGHNESS 0.3 MEANS IT CAN BE MINED AT 3.3333X. YOUR RETRO MINER DOES 0.5/S, SO YOU MINE ${T.mineRate.toFixed(2)} PER SECOND.`,
      'PRESS START MINING AND COLLECT 50 LUNARRITE.']);
  } else if (dest === 'farport' && S.step === 4) {
    S.step = 5; render();
    popup('BACK AT FARPORT. TAKE THE LUNARRITE TO TOBIN\'S HUT.');
  } else render();
}

/* ---------- leaving into space: pixel boom, then the map unlocks ---------- */
function leaveIntoSpace() {
  S.step = 7; S.mapUnlocked = true;
  $('#screen').innerHTML = '';
  const c = $('#fx'), x = c.getContext('2d');
  const cols = ['#ffffff', '#bbbbbb', '#777777', '#f5a623'];
  const ps = Array.from({ length: 260 }, () => { const a = Math.random() * 6.283, v = 40 + Math.random() * 380;
    return { x: 460, y: 280, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: rnd(cols), z: 4 + Math.floor(Math.random() * 3) * 4 }; });
  let t = 0, prev = performance.now();
  (function loop(now) {
    const dt = (now - prev) / 1000; prev = now; t += dt;
    x.clearRect(0, 0, 920, 560);
    for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.vy *= 0.985;
      x.globalAlpha = Math.max(0, 1 - t / 2); x.fillStyle = p.c; x.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.z, p.z); }
    x.globalAlpha = 1;
    if (t < 2) return requestAnimationFrame(loop);
    x.clearRect(0, 0, 920, 560);
    S.view = 'map'; render();
    popups(['SYSTEMS UNLOCKED: THE PORT SYSTEM AND THE LEAR SYSTEM.',
      'DRAG TO MOVE THE MAP. SHIFT + DRAG, THE MOUSE WHEEL OR THE ROTATE BUTTONS TURN IT. CLICK A PLANET TO TRAVEL.'], showComplete);
  })(prev);
}

/* ---------- map ---------- */
const M = { cam: { x: 0, y: 0 }, rot: 0, sel: null, drag: null, moved: 0 };
function sysOf(loc) { return SYSTEMS.find(s => s.planet.id === loc); }
function renderMap(el) {
  const s = sysOf(S.loc); M.cam = { x: s.x, y: s.y }; M.sel = null;
  el.innerHTML = `<canvas class="map" id="mc" width="920" height="560"></canvas>${hud()}
    <div class="panel" id="mp"></div>
    <div class="actions" style="bottom:44px"><button class="btn" id="rl">&lt; ROTATE</button><button class="btn" id="rr">ROTATE &gt;</button></div>
    <div class="banner">MORE SYSTEMS - COMING SOON</div>`;
  const c = $('#mc');
  const pt = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * 920 / r.width, y: (e.clientY - r.top) * 560 / r.height }; };
  c.oncontextmenu = e => e.preventDefault();
  c.onpointerdown = e => { c.setPointerCapture(e.pointerId); M.drag = pt(e); M.moved = 0; };
  c.onpointermove = e => {
    if (!M.drag) return;
    const p = pt(e), dx = p.x - M.drag.x, dy = p.y - M.drag.y; M.moved += Math.abs(dx) + Math.abs(dy);
    if (e.shiftKey || e.buttons === 2) M.rot += dx * 0.01;
    else { const a = -M.rot; M.cam.x -= dx * Math.cos(a) - dy * Math.sin(a); M.cam.y -= dx * Math.sin(a) + dy * Math.cos(a); }
    M.drag = p;
  };
  c.onpointerup = e => { if (M.moved < 5) pick(pt(e)); M.drag = null; };
  c.onwheel = e => { e.preventDefault(); M.rot += e.deltaY * 0.002; };
  $('#rl').onclick = () => M.rot -= 0.3;
  $('#rr').onclick = () => M.rot += 0.3;
  panel();
}
const proj = (wx, wy) => { const dx = wx - M.cam.x, dy = wy - M.cam.y, c = Math.cos(M.rot), s = Math.sin(M.rot);
  return { x: 460 + dx * c - dy * s, y: 280 + dx * s + dy * c }; };
function planetPos(sys, time) { const p = sys.planet, a = p.angle + time * p.speed;
  return proj(sys.x + Math.cos(a) * sys.ring, sys.y + Math.sin(a) * sys.ring); }
function pick(p) {
  const t = performance.now() / 1000; M.sel = null;
  for (const s of SYSTEMS) { const q = planetPos(s, t); if (Math.hypot(q.x - p.x, q.y - p.y) < s.planet.r + 12) M.sel = s; }
  panel();
}
function panel() {
  const el = $('#mp'); if (!el) return;
  const s = M.sel; if (!s) { el.innerHTML = '<div class="box" style="font-size:8px">CLICK A PLANET</div>'; return; }
  const here = S.loc === s.planet.id;

    lvl: 1 + Math.random() * 5 | 0, mobName: rnd(['VOID WASPS', 'PIRATE RAIDERS', 'CRYSTAL HOUNDS', 'RUST DRONES', 'NEBULA LEECHES']), pal, pal2, seed: 100 + n * 13, looted: false, visited: false, cd: 0 };

function hostile(text, lp) {

    ['FIGHT', () => { const w = clamp(.35 + .12 * S.up.weapon + .03 * S.up.armor + SHIPS[S.type].cmb, .1, .85);
      if (Math.random() < w) { const g = 400 + Math.random() * 1100 | 0; S.zeals += g; refreshHud(); popup(`VICTORY! YOU SALVAGED ${g} Z FROM THE WRECKS.`); } else popup(`YOU LOST THE FIGHT AND ${loseZ(lp * 1.2)} Z.`); }]]);

/* ---------- travel: routes with risk, long exploration trips, generated animation ---------- */

}

  if (ev === 0) popup(Math.random() < thrustP() ? 'ASTEROID FIELD! YOU THREADED THROUGH WITH A STEADY HAND.' : `ASTEROID FIELD! HULL DAMAGE COSTS ${loseZ(.05)} Z IN REPAIRS.`);
  else if (ev === 1) hostile('PIRATE PATROL ON THE SHORT ROUTE! THEY DEMAND YOUR ZEALS.', .08);
  else popup(Math.random() < .18 * S.up.armor ? 'SOLAR FLARE! YOUR DEFENSES ABSORB THE BLAST.' : `SOLAR FLARE! SCORCHED SYSTEMS COST ${loseZ(.04)} Z.`);
}
const _arr = arrive;
arrive = function (d) { const risky = S.travel && S.travel.risky; _arr(d); if (risky && Math.random() < .45) routeEvent(); };
function tickTravel(dt) {

  const key = S.type + JSON.stringify(S.paint); if (!S._spr || S._spr.k !== key) S._spr = { k: key, c: shipSprite(S.type, S.paint) };
  const c = $('#tc').getContext('2d'), sc = 3; c.imageSmoothingEnabled = false; c.fillStyle = '#02030a'; c.fillRect(0, 0, 920, 560);
  for (let i = 0; i < 6; i++) { c.fillStyle = 'rgba(90,60,160,.14)'; const nx = ((i * 211 - tr.t * 20) % 1100 + 1100) % 1100 - 100; c.fillRect(Math.round(nx / 8) * 8, 60 + i * 80, 160 + i * 20, 48); }
  for (const s of stars) { s.x -= s.s * (warp ? 1100 : 220) * dt; if (s.x < -80) { s.x = 940; s.y = Math.random() * 560; }
    const z = s.s < .6 ? 4 : s.s < 1 ? 8 : 12; c.fillStyle = s.s < .6 ? '#667' : s.s < 1 ? '#bbb' : '#fff'; c.fillRect(Math.round(s.x / 4) * 4, Math.round(s.y / 4) * 4, warp ? z * 4 : z, 4); }
  const bob = Math.round(Math.sin(tr.t * 3) * 2) * 3, sx = 130, sy = 130 + bob, glow = S.paint.glow || '#ff9d3c', pal = ['#fff', '#fff3b0', '#ffd24a', glow, '#ff5a2a', '#a02a1a', '#601810'];
  shipEngY(S.type).forEach(ey => { const fy = sy + ey * sc, len = 9 + (Math.random() * 6 | 0) + (warp ? 6 : 0);
    for (let k = 0; k < len; k++) { c.fillStyle = pal[Math.min(6, k >> 1)]; const h = k < 4 ? 12 : k < 8 ? 9 : 5; c.fillRect(sx - (k + 1) * 6, fy - h / 2, 6, h); }
    tr.sp.push({ x: sx, y: fy, vx: -(250 + Math.random() * 300), vy: (Math.random() - .5) * 60, l: 1 }); });
  tr.sp = tr.sp.filter(p => (p.l -= dt * 1.6) > 0); for (const p of tr.sp) { p.x += p.vx * dt; p.y += p.vy * dt; c.fillStyle = p.l > .5 ? '#ffb347' : '#ff5a2a'; c.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, 4, 4); }
  c.drawImage(S._spr.c, sx, sy, 200 * sc, 100 * sc);

  x.fillStyle = '#000'; x.fillRect(0, 0, 920, 560); x.fillStyle = '#444'; for (let i = 0; i < 70; i++) x.fillRect((i * 137) % 920, (i * 71) % 560, 2, 2);
  const a = proj(SYSTEMS[0].x, SYSTEMS[0].y), b = proj(SYSTEMS[1].x, SYSTEMS[1].y);

/* ---------- main loop: mining, colony, market, jobs, autosave ---------- */
function produce(dt) {
  S.sv += dt; if (S.sv > 4) { S.sv = 0; save(); }
  S.mkT += dt; if (S.mkT > 15) { S.mkT = 0; driftMarket(); if (S.view === 'planet' && S.loc === 'bazaar') shopUI(); }
  if (S.step >= 11) { if (!S.jobs.length) genJobs(); S.jobT -= dt; if (S.jobT <= 0) genJobs(); }
  if (S.cd > 0) S.cd -= dt;
  if (S.job && !S.job.done && S.step >= 11) { S.job.left -= dt; if (S.job.left <= 0) { S.job = null; S.mining = false; S.ore = 0; refreshHud(); popup('JOB EXPIRED! YOU RAN OUT OF TIME.'); if (S.view === 'planet') render(); } }
  if (_pj && _pj.done && !S.job) S.done++; _pj = S.job;
  if (S.zeals - lastZ >= 200) ching(); lastZ = S.zeals;
  _sec += dt; if (_sec >= 1) { _sec = 0; if (S.job && !S.job.done) refreshHud(); const p = isD(S.loc) && findP(S.loc); setMood(S.view === 'travel' ? 'travel' : p && p.type === 'mobs' ? 'tense' : 'calm'); }
  if (S.caves && S.homes) { S.acc += dt; if (S.acc >= 10) { S.acc = 0; const rolls = Math.ceil(S.homes / 3) + S.farms, got = {};
    for (let i = 0; i < rolls; i++) { let n = Math.random() * 100, r = RES[0]; for (const q of RES) { if (n < q.w) { r = q; break; } n -= q.w; } S.inv[r.k]++; got[r.n] = (got[r.n] || 0) + 1; }
    toast('RESIDENTS FOUND: ' + Object.entries(got).map(([k, v]) => `+${v} ${k}`).join(', ')); if (S.view === 'planet' && S.loc === 'home') colonyInfo(); if (S.view === 'planet' && S.loc === 'bazaar') shopUI(); } }
}
function tick(now) {

}
